services:
  postgres:
    image: postgres:16
    container_name: sentiment-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: sentiment-ai-service
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  crawler-service:
    build:
      context: .
      dockerfile: crawler-service/Dockerfile
    container_name: sentiment-crawler-service
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      LAZADA_ENV_FILE: /run/duancntt/config/.env
    volumes:
      - crawler_data:/var/lib/crawler
      # Mount the directory so editor atomic saves of .env are visible immediately.
      - type: bind
        source: .
        target: /run/duancntt/config
        read_only: true
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentiment-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-http://localhost:5173}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-DuanCNTT <no-reply@duancntt.local>}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      crawler-service:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: sentiment-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentiment-frontend
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  crawler_data:
